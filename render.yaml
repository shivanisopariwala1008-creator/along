# Render Blueprint: Along as a single web service (Jac API + prebuilt frontend).
#
# Memory is the constraint (512 MB on free/starter). Two things keep it low:
#   - The frontend is built at *build* time as a PWA. At runtime jac-scale sees
#     the PWA manifest and serves those files instead of re-running Vite, which
#     needs ~1.5 GB (it otherwise rebuilds on startup or on the first page hit).
#   - `--faux` compiles every Jac module during the build; XDG_CACHE_HOME keeps
#     that cache inside the deployed project so startup skips the ~700 MB cold
#     compile. Measured locally: startup ~330 MB, steady ~340 MB.
#
# Render -> New -> Blueprint -> pick this repo. Secrets marked `sync: false`
# are entered in the Render dashboard, never committed.
services:
  - type: web
    name: along
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    # `jac start --faux` exits non-zero after printing on this jac-scale
    # version, which is harmless, hence `|| true`.
    buildCommand: >-
      pip install -r requirements.txt &&
      jac build main.jac --client pwa < /dev/null &&
      (jac start main.jac --faux < /dev/null || true)
    startCommand: jac start main.jac --port $PORT --host 0.0.0.0 < /dev/null
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: XDG_CACHE_HOME         # keep Jac's compile cache inside the deployed project
        value: /opt/render/project/src/.cache
      - key: MONGODB_URI            # your Atlas connection string
        sync: false
      - key: JWT_SECRET             # signs login tokens
        generateValue: true
      - key: ADMIN_PASSWORD         # built-in admin account (/admin)
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY    # optional; without it the drawn map is used
        sync: false
      - key: OPENAI_API_KEY         # optional; also uncomment byllm in requirements.txt
        sync: false
