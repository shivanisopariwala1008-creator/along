[project]
name = "along"
version = "0.0.1"
description = "Along — AI-powered peer-to-peer mobility matching for Michigan"
entry-point = "main.jac"
kind = "web-app"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"

[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"
api_key = "${OPENAI_API_KEY:-}"

# Python packages the server needs. Jac Hammer installs from this list, so
# jac-scale (login, sign-up, MongoDB storage) must be here, not only in
# requirements.txt.
[dependencies]
jac-scale = ">=0.2.31"
jac-client = ">=0.3.25"
jac-super = ">=0.1.22"
pymongo = ">=4.18.2"
certifi = "*"
requests = "*"
redis = "*"

[dependencies.npm]
sonner = "*"
shadcn = "^3.8.5"
tw-animate-css = "^1.4.0"
tailwind-merge = "^3.5.0"
clsx = "^2.1.1"
class-variance-authority = "*"
radix-ui = "*"
"@fontsource-variable/inter" = "*"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
"@vis.gl/react-google-maps" = "^1.10.1"

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[plugins.scale.jwt]
secret = "${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}"
exp_delta_days = 30

[plugins.scale.admin]
default_password = "${ADMIN_PASSWORD:-changeme}"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "green"
font = "inter"
radius = "large"
menuAccent = "subtle"
menuColor = "default"

[jacpack]
name = "along-journeys"
description = "Jac IDE snapshot for along-journeys"

[jachammer]
project_id = "prj_01b6686db5ee489ead1f1b6b77f242a1"

# Installable app (PWA): name, colours; icons come from pwa_icons/.
[plugins.client.pwa]
theme_color = "#176b45"
background_color = "#f8f7f2"

[plugins.client.pwa.manifest]
name = "Along — shared journeys"
short_name = "Along"
description = "Find people heading your way across Michigan: rides, rentals and cab shares."

# Email (verification + password reset). Without SMTP settings, emails are
# printed to the server log by services/console_emailer.jac. For real email
# set EMAILER_PROVIDER=smtp plus the EMAILER_SMTP_* values (see .env.example).
[plugins.scale.emailer]
provider = "${EMAILER_PROVIDER:-services.console_emailer:ConsoleEmailer}"
from_address = "${EMAILER_FROM:-Along <no-reply@along.app>}"

[plugins.scale.emailer.smtp]
host = "${EMAILER_SMTP_HOST:-smtp.gmail.com}"
port = 587
username = "${EMAILER_SMTP_USERNAME:-}"
use_tls = true

[plugins.scale.auth]
verify_url_template = "${APP_URL:-http://localhost:8000}/verify-email?token={token}"
reset_url_template = "${APP_URL:-http://localhost:8000}/reset-password?token={token}"
